releaseNotes: >-
  Fixed a real-world case found right after 1.8.5 shipped: a miner
  reconnecting (or one with duplicate fallback pool entries) could still
  briefly show up twice in the dashboard while the 2.5-minute stale-worker
  cleanup caught up. Now a worker reconnecting with the same name from
  the same address immediately supersedes its own older connection
  instead of waiting for that cleanup.
