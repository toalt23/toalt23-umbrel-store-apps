releaseNotes: >-
  Fixed from real hardware testing (first Antminer Z9 mini connected to
  the pool): worker hashrate could show wildly inflated numbers because a
  single lucky share was throwing off the estimate — now uses the
  assigned share difficulty instead, giving a stable reading. Best share
  now displays as a plain number instead of scientific notation (e.g.
  "911" instead of "9.11e+2"). Stale shares (submitted for a job the pool
  has already moved on from) are now tracked and shown separately instead
  of disappearing silently.
