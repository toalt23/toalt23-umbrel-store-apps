releaseNotes: >-
  Significant mining fix. The pool was handing out new work every ~11 seconds
  because it rebuilt the job on every mempool change, which made miners throw
  away 10-20% of the solutions they had already found. New work from mempool
  changes is now spaced out, while a new block still goes out instantly — the
  same hardware should now get noticeably more of its shares counted.
