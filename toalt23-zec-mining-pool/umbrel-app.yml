releaseNotes: >-
  The job-failure warning banner now suggests concrete next steps
  (check the node, restart the app, check networking) instead of just
  showing the raw error, and gets more specific if it's been failing for
  more than 5 minutes. Miner tab polish: "How to connect" is shorter and
  starts collapsed, the save button is fixed up (right size, clearer
  "No changes" / "Changes applied" messages), and address/tag labels match
  the rest of the page's muted style instead of standing out.
