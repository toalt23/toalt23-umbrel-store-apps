releaseNotes: >-
  Reverted the previous release's job-broadcast throttling: log analysis
  traced the reported disconnects to the Z9 mini's own no-new-work
  watchdog (it reconnects if it goes ~90-135s without a fresh
  mining.notify), not a network issue. Back to broadcasting on every
  template change, including mempool-only refreshes — trades back some
  Sols/s for reliably stable connections.
