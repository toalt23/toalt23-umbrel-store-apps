releaseNotes: >-
  Explicit 30s TCP keepalive interval on stratum connections — helps
  detect a dead/NAT-dropped worker quickly instead of it hanging around
  in the dashboard, and keeps NAT mappings alive during the longer gaps
  between job broadcasts since the previous release's job-churn change.
  Also tuned the "low" difficulty preset from 24 to 50 (Z9 mini) and
  updated the matching connect-guide copy and docker-compose.yml comment.
