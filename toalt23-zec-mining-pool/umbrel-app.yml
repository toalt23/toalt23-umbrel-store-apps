releaseNotes: >-
  Stop broadcasting a new mining job on mempool-only template refreshes —
  only a genuine new block now triggers one. Solo mining gets no payoff
  from fresher fee selection, so the old behavior was just forcing
  frequent Equihash restarts on the miner for nothing (noticed as far
  fewer getworks on 2Miners solo vs. our pool). Experimental: testing
  live against the Z9 mini to see if effective Sols/s improves.
