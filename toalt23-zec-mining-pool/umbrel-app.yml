releaseNotes: >-
  Difficulty preset "low" retuned back to 24. Worker panel rebuilt to one
  line shorter: name/hashrate now share a row, shares/best-share share the
  row below. New per-worker hashrate chart (collapsed by default, 15m/1h/8h
  range picker) — history only lives as long as the worker stays connected.
  Miner tab now also shows pool-wide total hashrate, network hashrate and
  difficulty, and the old best-share banner is now a plain stat tile;
  Verification moved to the Node tab. Configuration tab's connect guide
  trimmed of parenthetical asides, with a coinbase-tag mention added and
  its ASIC examples corrected (medium: Z11, high: Z15/Z15 Pro).
