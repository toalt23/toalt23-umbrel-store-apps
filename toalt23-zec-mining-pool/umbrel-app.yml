releaseNotes: >-
  Follow-up from the 1.5.1 hashrate fix: the estimate was still off by
  ~524,288x because it reused a Bitcoin-specific constant that doesn't
  apply to Zcash's actual network parameters. Now derived from the live
  network target directly, so a real Antminer Z9 mini correctly shows
  ~12-14 kSol/s instead of GSol/s. Best share now uses the same
  K/M/G-style short-number format as the node's own difficulty stat
  (e.g. "1.68 K") instead of a plain integer.
