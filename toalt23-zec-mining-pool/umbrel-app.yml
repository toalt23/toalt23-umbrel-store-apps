releaseNotes: >-
  Follow-ups to 1.8.0's dashboard rework. Miner tab stat order changed to
  Network Hashrate, Difficulty, Workers, Pool Hashrate, Blocks Found,
  Pool's Best Share. Best-share tile now shows value/target together on
  one line, with worker + date + time (fixed to Europe/Berlin) below.
  Per-worker hashrate chart now has real axes: an adaptive kSol/s Y-axis
  (starts at each preset's typical range — low 5-35k, medium 50-150k,
  high 300-880k — but expands if the worker's actual hashrate goes
  outside it) and a 5-tick time-of-day X-axis (Berlin). Chart toggle
  relabeled "More details" with a bigger arrow right next to the text
  instead of pushed to the row's far edge. Configuration tab's step 1
  shortened to "Set the payout address and save (coinbase tag optional)".
