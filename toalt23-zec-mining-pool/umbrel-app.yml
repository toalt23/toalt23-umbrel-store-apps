releaseNotes: >-
  A worker that goes silent (power loss, cable pull, or a miner
  configured with duplicate fallback pool entries pointing back here)
  now disappears from the dashboard within ~2.5 minutes of its last
  accepted share, instead of relying on TCP keepalive alone (which can
  take much longer than previously assumed to notice a dead peer).
