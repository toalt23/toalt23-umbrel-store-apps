releaseNotes: >-
  More dashboard follow-ups. Miner tab renamed to "Pool", stat order now
  Network Hashrate, Difficulty, Pool Hashrate, Workers, Pool's Best
  Share, Blocks Found — best-share tile shows only value/target now
  (worker + timestamp dropped). Hashrate chart Y-axis uses round-number
  gridlines (5k/10k/15k/20k/25k for low, adapts per preset and expands
  if a worker's real hashrate goes outside the typical range), plus a
  hover/tap dot per time sector on the line showing exact kSol/s and
  time. Chart toggle's arrow moved in front of "More details", enlarged,
  and colored gold. Difficulty preset "low" raised back to 50 (from 24)
  after live testing showed it makes the chart's curve noticeably
  smoother.
