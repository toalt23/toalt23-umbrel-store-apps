releaseNotes: >-
  Reverted 1.8.6: immediately closing a duplicate worker connection
  caused a live reconnect-storm loop on a real ASIC (its firmware
  treated the close as its own connection dying and reconnected
  instantly, which triggered the same thing again, hundreds of times a
  second, until the miner was power-cycled). Back to 1.8.5's calmer
  behavior — a duplicate worker clears from the dashboard within ~2.5
  minutes rather than instantly, which does not have this failure mode.
