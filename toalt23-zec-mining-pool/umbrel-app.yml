releaseNotes: >-
  Faster block propagation via getblocktemplate long-poll, so new jobs go
  out right as a block is found instead of waiting for the next poll.
  Difficulty is now set via the miner's stratum password (low/medium/high)
  instead of a worker-name suffix, worker names are shown as-is. Added a
  "How to connect" guide with a worked example to the Miner tab. Saving
  the mining address/coinbase tag no longer restarts the node when nothing
  actually changed.
