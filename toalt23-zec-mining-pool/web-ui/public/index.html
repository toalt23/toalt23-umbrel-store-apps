<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEC Mining Node</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f14;
      --card: #1a1a22;
      --card-alt: #22222c;
      --text: #eaeaea;
      --text-dim: #888;
      --gold-1: #cf8724;
      --gold-2: #fdce58;
      --green: #4ade80;
      --red: #f87171;
      --amber: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    .app { max-width: 560px; width: 100%; }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .logo { width: 70px; height: 70px; flex-shrink: 0; }
    .title { display: flex; flex-direction: column; }
    .title h1 { font-size: 1.8rem; margin: 0; font-weight: 700; }
    .chain-row { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
    .chain-row span:first-child { font-size: 0.9rem; color: var(--text-dim); }
    .chain-row span:first-child.offline { color: var(--red); }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .status-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-dot.offline { background: var(--red); box-shadow: 0 0 8px var(--red); }

    nav.tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
      background: var(--card);
      border-radius: 10px;
      padding: 4px;
    }
    nav.tabs button {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 1.02rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    nav.tabs button.active { background: var(--card-alt); color: var(--text); }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat { background: var(--card-alt); padding: 12px; border-radius: 10px; min-height: 90px; }
    .stat.hidden { display: none; }
    .stat-label { font-size: 0.82rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }
    .stat-value { font-size: 1.22rem; font-weight: 600; margin-top: 4px; word-break: break-word; }
    .stat-value.synced { color: var(--green); }
    .stat-value.syncing { color: var(--amber); }
    .stat-sub { font-size: 0.82rem; color: var(--text-dim); margin-top: 2px; }

    .footer-row {
      display: flex;
      justify-content: flex-start;
      margin-top: 18px;
      margin-left: 6px;
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .placeholder { text-align: center; padding: 44px 16px; color: var(--text-dim); }
    .placeholder .big { font-size: 2.64rem; margin-bottom: 10px; }
    .placeholder .sub { font-size: 0.96rem; margin-top: 6px; opacity: 0.7; }

    .boot-state { display: none; text-align: left; padding: 60px 16px 60px 82px; color: var(--text); font-size: 1.35rem; }
    .app.booting .boot-state { display: block; }
    .app.booting .chain-row,
    .app.booting nav.tabs,
    .app.booting .card,
    .app.booting .powered-by { display: none; }

    .powered-by {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 14px;
    }
    .powered-by span {
      font-family: 'Yuji Mai', cursive;
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    .powered-by img { height: 28px; width: auto; display: block; }
  </style>
</head>
<body>
  <div class="app booting">
    <header>
      <svg class="logo" viewBox="0 0 2500 2500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0" stop-color="#cf8724"/>
            <stop offset="1" stop-color="#fdce58"/>
          </linearGradient>
        </defs>
        <path fill="url(#zGrad)" d="M1263.05,2297.61c-569.6,0-1034.57-465.43-1034.57-1034.56,0-569.6,465.44-1034.57,1034.57-1034.57,569.6,0,1034.56,465.44,1034.56,1034.57C2297.61,1832.65,1832.65,2297.61,1263.05,2297.61Z"/>
        <path fill="#0f0f14" d="M1250,2500C562.5,2500,0,1937.5,0,1250S562.5,0,1250,0,2500,562.5,2500,1250,1937.5,2500,1250,2500Zm0-2222.06c-534.56,0-972.06,437.5-972.06,972.06s437.5,972.06,972.06,972.06,972.06-437.5,972.06-972.06S1784.56,277.94,1250,277.94Z"/>
        <path fill="#0f0f14" d="M1221.05,1588.59h541.67v270.84h-319.6v229.16H1165.18V1866.53H831.85c0-90.44-13.73-180.4,7.1-263.73,7.1-41.67,55.4-83.34,90.43-125,104.17-125,208.34-250,319.61-375,41.66-48.77,83.33-90.44,132.1-145.83H860.26V686.13h305.39V457h270.84V679h333.33c0,90.43,13.73,180.4-7.1,263.73-7.1,41.67-55.4,83.33-90.44,125-104.16,125-208.33,250-319.6,375C1311,1491.53,1269.35,1539.82,1221.05,1588.59Z"/>
      </svg>
      <div class="title">
        <h1>ZEC Mining Node</h1>
        <div class="chain-row">
          <span id="chainLabel">–</span>
          <span class="status-dot" id="statusDot"></span>
        </div>
      </div>
    </header>

    <div class="boot-state" id="bootState">
      Node startet und wird konfiguriert <span id="bootDots">.</span>
    </div>

    <nav class="tabs">
      <button class="active" data-tab="node">Node</button>
      <button data-tab="miner">Miner</button>
    </nav>

    <section id="tab-node" class="card">
      <div class="stats">
        <div class="stat"><div class="stat-label">Blockhöhe</div><div class="stat-value" id="currentHeight">–</div></div>
        <div class="stat hidden" id="syncStat">
          <div class="stat-label">Sync-Status</div>
          <div class="stat-value" id="syncStatus">–</div>
          <div class="stat-sub" id="syncSub"></div>
        </div>
        <div class="stat hidden" id="hashrateStat"><div class="stat-label">Netzwerk-Hashrate</div><div class="stat-value" id="hashrate">–</div></div>
        <div class="stat"><div class="stat-label">Difficulty</div><div class="stat-value" id="difficulty">–</div></div>
        <div class="stat hidden" id="priceStat"><div class="stat-label">ZEC-Preis</div><div class="stat-value" id="price">–</div></div>
        <div class="stat hidden" id="rewardStat"><div class="stat-label">Blockbelohnung</div><div class="stat-value" id="reward">–</div></div>
        <div class="stat hidden" id="peersStat"><div class="stat-label">Peers</div><div class="stat-value" id="peers">–</div></div>
        <div class="stat hidden" id="diskStat"><div class="stat-label">Chain-Größe</div><div class="stat-value" id="disk">–</div></div>
        <div class="stat hidden" id="versionStat"><div class="stat-label">Node-Version</div><div class="stat-value" id="version">–</div></div>
      </div>

      <div class="footer-row">
        <span id="lastUpdate">–</span>
      </div>
    </section>

    <section id="tab-miner" class="card" style="display:none">
      <div class="placeholder">
        <div class="big">⛏️</div>
        <div>Miner- &amp; Pool-Statistiken folgen hier bald.</div>
        <div class="sub">Stratum-Server ist in Vorbereitung.</div>
      </div>
    </section>

    <div class="powered-by">
      <span>Powered by</span>
      <img src="/zakura-logo.png" alt="Zakura">
    </div>
  </div>

  <script>
    document.querySelectorAll('nav.tabs button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('nav.tabs button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-node').style.display = btn.dataset.tab === 'node' ? 'block' : 'none';
        document.getElementById('tab-miner').style.display = btn.dataset.tab === 'miner' ? 'block' : 'none';
      });
    });

    let consecutiveFailures = 0;
    const FAILURE_THRESHOLD = 3;

    let hasConnectedOnce = false;
    let bootDotCount = 0;
    const bootTimer = setInterval(() => {
      bootDotCount = (bootDotCount + 1) % 4;
      const el = document.getElementById('bootDots');
      if (el) el.textContent = '.'.repeat(bootDotCount);
    }, 500);

    function formatSolps(v) {
      if (v == null) return null;
      const units = ['Sol/s', 'kSol/s', 'MSol/s', 'GSol/s'];
      let i = 0;
      while (v >= 1000 && i < units.length - 1) { v /= 1000; i++; }
      return v.toFixed(2) + ' ' + units[i];
    }

    function formatShortNumber(v) {
      if (v == null) return null;
      const units = ['', 'K', 'M', 'G', 'T'];
      let i = 0;
      while (v >= 1000 && i < units.length - 1) { v /= 1000; i++; }
      return v.toFixed(2) + (units[i] ? ' ' + units[i] : '');
    }

    function formatBytes(bytes) {
      if (bytes == null) return null;
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0;
      let v = bytes;
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      return v.toFixed(1) + ' ' + units[i];
    }

    const BLOCK_REWARD_ZEC = 1.25;

    function formatEur(v) {
      if (v == null) return null;
      return v.toLocaleString('de-DE', {
        style: 'currency',
        currency: 'EUR',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
    }

    function setStat(valueId, wrapperId, value) {
      const wrapper = document.getElementById(wrapperId);
      if (value == null || value === '') {
        wrapper.classList.add('hidden');
        return;
      }
      wrapper.classList.remove('hidden');
      document.getElementById(valueId).textContent = value;
    }

    async function updateStatus() {
      try {
        const res = await fetch('/api/node/status');
        const data = await res.json();

        const dot = document.getElementById('statusDot');
        const chainLabel = document.getElementById('chainLabel');

        if (data.connected) {
          consecutiveFailures = 0;
          dot.className = 'status-dot online';
          chainLabel.classList.remove('offline');

          if (!hasConnectedOnce) {
            hasConnectedOnce = true;
            clearInterval(bootTimer);
            document.querySelector('.app').classList.remove('booting');
          }

          chainLabel.textContent =
            data.chain === 'main' ? 'Mainnet' : (data.chain === 'test' ? 'Testnet' : (data.chain ?? '–'));
          document.getElementById('currentHeight').textContent =
            data.currentHeight != null ? data.currentHeight.toLocaleString('de-DE') : '–';

          document.getElementById('syncStat').classList.remove('hidden');
          const syncEl = document.getElementById('syncStatus');
          const syncSub = document.getElementById('syncSub');
          if (data.synced) {
            syncEl.textContent = '100%';
            syncEl.className = 'stat-value synced';
            syncSub.textContent = '';
          } else {
            const pct = data.syncProgress ?? 0;
            syncEl.textContent = pct.toFixed(2) + '%';
            syncEl.className = 'stat-value syncing';
            syncSub.textContent = data.estimatedHeight
              ? 'Ziel: ' + data.estimatedHeight.toLocaleString('de-DE')
              : 'Synchronisiert …';
          }

          document.getElementById('difficulty').textContent =
            data.difficulty != null ? formatShortNumber(Number(data.difficulty)) : '–';

          setStat('hashrate', 'hashrateStat', formatSolps(data.networkSolps));
          setStat('peers', 'peersStat', data.peers != null ? String(data.peers) : null);
          setStat('price', 'priceStat', formatEur(data.zecEurPrice));
          setStat(
            'reward',
            'rewardStat',
            data.zecEurPrice != null
              ? BLOCK_REWARD_ZEC.toFixed(2) + ' ZEC | ' + formatEur(BLOCK_REWARD_ZEC * data.zecEurPrice)
              : null,
          );
          setStat('disk', 'diskStat', formatBytes(data.sizeOnDiskBytes));
          setStat(
            'version',
            'versionStat',
            data.version ? data.version.replace(/^\/+|\/+$/g, '').replace(':', ': ') : null,
          );

          document.getElementById('lastUpdate').textContent =
            'Letztes Update: ' + new Date().toLocaleTimeString('de-DE');
        } else {
          consecutiveFailures++;
          if (consecutiveFailures >= FAILURE_THRESHOLD) {
            dot.className = 'status-dot offline';
            chainLabel.classList.add('offline');
          }
        }
      } catch (e) {
        consecutiveFailures++;
        if (consecutiveFailures >= FAILURE_THRESHOLD) {
          document.getElementById('statusDot').className = 'status-dot offline';
          document.getElementById('chainLabel').classList.add('offline');
        }
      }
    }

    updateStatus();
    setInterval(updateStatus, 10000);
  </script>
</body>
</html>
